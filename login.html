<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceso · BAUTO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #B85C38;
    --accent-hover: #A04F2F;
    --bg: #EFEAE1;
    --text: #1C1917;
    --text-secondary: #6E6E6E;
    --font-heading: 'Sora', sans-serif;
    --font-body: 'Plus Jakarta Sans', sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--text); font-family: var(--font-body); }

  .login-panel { width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 20px; padding: 40px; border-radius: 40px; background: linear-gradient(160deg, #F6F3ED 0%, #E6DFD2 100%); box-shadow: 0 24px 60px rgba(44,44,44,.12); }

  .celestial { position: relative; height: 168px; border-radius: 14px; border: 1px solid rgba(255,255,255,.5); overflow: hidden; background: linear-gradient(180deg, #BFD3DD 0%, #EBD9C4 100%); }
  .celestial .orb { position: absolute; top: 34px; left: 44px; width: 84px; height: 84px; border-radius: 50%; background: radial-gradient(circle at 40% 38%, #FF5A1E, #FFA566 70%); box-shadow: 0 0 60px 20px rgba(255,165,102,.55); }
  .badge { position: absolute; bottom: 14px; padding: 9px 14px; border-radius: 10px; background: rgba(255,255,255,.45); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,.5); font-size: 12px; font-weight: 500; }
  .badge-date { left: 14px; }
  .badge-store { right: 14px; }

  .form-card { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 20px; border-radius: 14px; background: rgba(255,255,255,.45); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,.5); }
  .form-title { font-family: var(--font-heading); font-size: 23px; font-weight: 500; }
  .field { box-sizing: border-box; width: 70%; max-width: 260px; height: 44px; border-radius: 10px; border: 1px solid rgba(255,255,255,.6); background: rgba(255,255,255,.6); padding: 0 16px; font-family: var(--font-body); font-size: 14px; color: var(--text); outline: none; }
  .field.code { max-width: 260px; font-size: 18px; font-weight: 600; letter-spacing: .35em; text-align: center; }
  .field-error { display: none; width: 70%; max-width: 260px; font-size: 12px; color: #DC2626; }
  .field-error.show { display: block; }

  .btn-row { width: 100%; display: flex; justify-content: center; padding-top: 18px; border-top: 1px solid rgba(255,255,255,.25); }
  .btn-primary { border-radius: 999px; border: none; background: var(--accent); color: #FAF9F6; font-family: var(--font-heading); font-size: 16px; font-weight: 600; padding: 14px 34px; cursor: pointer; }
  .btn-primary:hover { background: var(--accent-hover); }

  .step { display: none; flex-direction: column; gap: 20px; }
  .step.active { display: flex; }
</style>
</head>
<body>

<div class="login-panel">
  <div class="celestial">
    <div class="orb"></div>
    <div class="badge badge-date" id="today-badge">Viernes, 28 ago 2026</div>
    <div class="badge badge-store">Tienda Centro</div>
  </div>

  <div class="step active" id="step-1">
    <div class="form-card">
      <div class="form-title">Iniciar sesión</div>
      <input type="text" class="field" id="input-user" placeholder="Usuario">
      <input type="password" class="field" id="input-pass" placeholder="Contraseña">
      <div class="field-error" id="error-1">Escribe tu usuario y tu contraseña.</div>
      <div class="btn-row">
        <button type="button" class="btn-primary" id="btn-step1">Ingresar</button>
      </div>
    </div>
  </div>

  <div class="step" id="step-2">
    <div class="form-card">
      <div class="form-title">Verifica tu acceso</div>
      <input type="text" class="field code" id="input-code" placeholder="· · · · · ·" maxlength="6" inputmode="numeric">
      <div class="field-error" id="error-2">Escribe el código de 6 dígitos.</div>
      <div class="btn-row">
        <button type="button" class="btn-primary" id="btn-step2">Verificar</button>
      </div>
    </div>
  </div>
</div>

<script>
  document.getElementById('today-badge').textContent =
    new Date().toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' })
      .replace(/^\w/, c => c.toUpperCase());

  document.getElementById('btn-step1').addEventListener('click', function () {
    var user = document.getElementById('input-user').value.trim();
    var pass = document.getElementById('input-pass').value.trim();
    var error = document.getElementById('error-1');
    if (!user || !pass) {
      error.classList.add('show');
      return;
    }
    error.classList.remove('show');
    // Aquí va la llamada real a loginAdmin(usuario, contraseña, geoPayload) del backend.
    document.getElementById('step-1').classList.remove('active');
    document.getElementById('step-2').classList.add('active');
  });

  document.getElementById('btn-step2').addEventListener('click', function () {
    var code = document.getElementById('input-code').value.trim();
    var error = document.getElementById('error-2');
    if (code.length !== 6) {
      error.classList.add('show');
      return;
    }
    error.classList.remove('show');
    // Aquí va la llamada real a verificarCodigo2FA(preAuthToken, codigo, geoPayload) del backend.
  });
</script>

</body>
</html>
